[package]
name = "larql-compute-cuda"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CUDA backend scaffold for LARQL. Implements the shared compute/KV traits while the kernel surface is brought up incrementally."
keywords = ["cuda", "gpu", "quantization", "matmul"]
categories = ["science"]

[dependencies]
cudarc = { version = "0.19.8", default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-11040"] }
larql-compute = { path = "../larql-compute" }
larql-models = { path = "../larql-models" }
ndarray = "0.16"
half = "2"

[dev-dependencies]
larql-compute = { path = "../larql-compute", features = ["test-utils"] }
larql-models = { path = "../larql-models", features = ["test-utils"] }
