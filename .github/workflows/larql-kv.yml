# larql-kv Linux CI
#
# Pluggable KV-cache engines (markov-rs, unlimited-context, turbo-quant,
# apollo). The crate is model-architecture agnostic: tests use synthetic
# `larql_inference::test_utils` fixtures, no real model weights, no
# platform-specific GPU backends. Same surface runs on the Linux
# self-hosted runner.

name: larql-kv

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-kv/**'
      - 'crates/larql-inference/src/test_utils.rs'
      - 'crates/larql-inference/src/forward/**'
      - 'crates/larql-inference/src/attention/**'
      - 'crates/larql-inference/src/ffn/**'
      - 'crates/larql-inference/src/residual.rs'
      - 'crates/larql-inference/src/vindex/**'
      - 'crates/larql-inference/src/model.rs'
      - 'crates/larql-inference/src/layer_graph/pipeline_layer.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-kv.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-kv/**'
      - 'crates/larql-inference/src/test_utils.rs'
      - 'crates/larql-inference/src/forward/**'
      - 'crates/larql-inference/src/attention/**'
      - 'crates/larql-inference/src/ffn/**'
      - 'crates/larql-inference/src/residual.rs'
      - 'crates/larql-inference/src/vindex/**'
      - 'crates/larql-inference/src/model.rs'
      - 'crates/larql-inference/src/layer_graph/pipeline_layer.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-kv.yml'
  workflow_dispatch: {}

env:
  LARQL_KV_COVERAGE_MIN: 85
  # This self-hosted runner's CPU does not expose AVX2 (confirmed by the
  # scalar-fallback fix in
  # `larql-vindex/src/index/storage/gate_store.rs`, which had to work
  # around the same class of crash locally). System OpenBLAS (installed
  # below, a transitive dep via larql-inference/larql-compute) picks a
  # SIMD kernel at runtime via its own CPU-model dispatch table
  # ("DYNAMIC_ARCH"), and on this host it was landing on a kernel that
  # assumes AVX2 anyway — hence the SIGILL/SIGSEGV crashes mid-test-run.
  # Pinning a pre-AVX coretype (Nehalem: SSE4.2 baseline, ~2008+) forces
  # OpenBLAS onto a kernel this CPU can actually execute, at the cost of
  # some BLAS throughput. Don't "upgrade" this to Haswell/Sandybridge
  # etc. without confirming the runner actually has AVX2 — that's what
  # caused this in the first place.
  OPENBLAS_CORETYPE: NEHALEM
  # Likewise, `nproc`-based thread-pool sizing (OpenBLAS's own pthread
  # pool) can oversubscribe if the container's visible CPU count doesn't
  # match its actual cgroup quota — capping this removes a second source
  # of the same class of crash.
  OPENBLAS_NUM_THREADS: '4'

jobs:
  test:
    name: test - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-kv-

      - name: Format check
        run: cargo fmt -p larql-kv -- --check

      - name: Check all targets
        run: cargo check -p larql-kv --all-targets

      - name: Check examples
        run: cargo check -p larql-kv --examples

      - name: Clippy
        # `--no-deps` keeps lints scoped to larql-kv itself; otherwise
        # any pre-existing clippy debt in larql-inference (a transitive
        # dep) would surface here even though it's not this crate's
        # concern. Other crates' workflows don't need this because they
        # don't depend on larql-inference.
        run: cargo clippy -p larql-kv --all-targets --no-deps -- -D warnings

      - name: Tests
        run: cargo test -p larql-kv

      - name: Benchmark compile/tests
        run: cargo test -p larql-kv --benches

  coverage:
    name: coverage - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --package larql-kv --summary-only --fail-under-lines "$LARQL_KV_COVERAGE_MIN"

      - name: Coverage policy
        run: |
          mkdir -p coverage/larql-kv
          cargo llvm-cov report --package larql-kv --json --summary-only --output-path coverage/larql-kv/summary.json
          python3 scripts/check_coverage_policy.py coverage/larql-kv/summary.json crates/larql-kv/coverage-policy.json
