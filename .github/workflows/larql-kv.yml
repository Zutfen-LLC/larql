# larql-kv Linux CI
#
# Pluggable KV-cache engines (markov-rs, unlimited-context, turbo-quant,
# apollo). The crate is model-architecture agnostic: tests use synthetic
# `larql_inference::test_utils` fixtures, no real model weights, no
# platform-specific GPU backends. Same surface runs on the Linux
# self-hosted runner.

name: larql-kv

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-kv/**'
      - 'crates/larql-inference/src/test_utils.rs'
      - 'crates/larql-inference/src/forward/**'
      - 'crates/larql-inference/src/attention/**'
      - 'crates/larql-inference/src/ffn/**'
      - 'crates/larql-inference/src/residual.rs'
      - 'crates/larql-inference/src/vindex/**'
      - 'crates/larql-inference/src/model.rs'
      - 'crates/larql-inference/src/layer_graph/pipeline_layer.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-kv.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-kv/**'
      - 'crates/larql-inference/src/test_utils.rs'
      - 'crates/larql-inference/src/forward/**'
      - 'crates/larql-inference/src/attention/**'
      - 'crates/larql-inference/src/ffn/**'
      - 'crates/larql-inference/src/residual.rs'
      - 'crates/larql-inference/src/vindex/**'
      - 'crates/larql-inference/src/model.rs'
      - 'crates/larql-inference/src/layer_graph/pipeline_layer.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-kv.yml'
  workflow_dispatch: {}

env:
  LARQL_KV_COVERAGE_MIN: 85
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: ghcr.io/zutfen-llc/larql-ci-rust:latest
      volumes:
        - larql-cargo-registry:/usr/local/cargo/registry

    steps:
      - uses: actions/checkout@v6

      - name: Verify sccache + MinIO connectivity
        # sccache is pre-baked in the CI image. Just verify MinIO is reachable.
        # If unreachable, disable sccache so the build still completes.
        run: |
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Format check
        run: cargo fmt -p larql-kv -- --check

      - name: Check all targets
        run: cargo check -p larql-kv --all-targets

      - name: Check examples
        run: cargo check -p larql-kv --examples

      - name: Clippy
        # `--no-deps` keeps lints scoped to larql-kv itself; otherwise
        # any pre-existing clippy debt in larql-inference (a transitive
        # dep) would surface here even though it's not this crate's
        # concern. Other crates' workflows don't need this because they
        # don't depend on larql-inference.
        run: cargo clippy -p larql-kv --all-targets --no-deps -- -D warnings

      - name: Tests
        run: cargo test -p larql-kv

      - name: Benchmark compile/tests
        run: cargo test -p larql-kv --benches

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true
  coverage:
    name: coverage - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: ghcr.io/zutfen-llc/larql-ci-rust:latest
      volumes:
        - larql-cargo-registry:/usr/local/cargo/registry

    steps:
      - uses: actions/checkout@v6

      - name: Verify sccache + MinIO connectivity
        # sccache is pre-baked in the CI image. Just verify MinIO is reachable.
        # If unreachable, disable sccache so the build still completes.
        run: |
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Disable sccache for coverage instrumentation
        # sccache serves cached, uninstrumented object code, which suppresses
        # llvm-cov region/line measurement. Run the coverage build uncached.
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Coverage summary
        run: cargo llvm-cov --package larql-kv --summary-only --fail-under-lines "$LARQL_KV_COVERAGE_MIN"

      - name: Coverage policy
        run: |
          mkdir -p coverage/larql-kv
          cargo llvm-cov report --package larql-kv --json --summary-only --output-path coverage/larql-kv/summary.json
          python3 scripts/check_coverage_policy.py coverage/larql-kv/summary.json crates/larql-kv/coverage-policy.json
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true
