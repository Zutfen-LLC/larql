# larql-models Linux CI
#
# Runs fmt + check + clippy + tests + bench test-mode on the Linux self-hosted
# runner for every change to the larql-models crate.

name: larql-models

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/larql-models.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/larql-models.yml'
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Reclaim root-owned workspace paths for host checkout
        run: sudo chmod -R a+rwX .git target .github coverage || true
      - uses: actions/checkout@v6

      - name: Install sccache (if missing)
        # If MinIO is unreachable, fall back to compiling without cache.
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
            sudo mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
            sudo chmod +x /usr/local/bin/sccache
          fi
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt -p larql-models -- --check

      - name: Check (all targets)
        run: cargo check -p larql-models --all-targets

      - name: Clippy (warnings as errors)
        # `--no-deps` so warnings in sibling crates' in-flight work do
        # not promote to errors here; matches the local `make
        # larql-models-lint` target.
        run: cargo clippy -p larql-models --all-targets --no-deps -- -D warnings

      - name: Test
        run: cargo test -p larql-models

      - name: Test benches
        run: cargo test -p larql-models --benches

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  coverage:
    name: coverage · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Reclaim root-owned workspace paths for host checkout
        run: sudo chmod -R a+rwX .git target .github coverage || true
      - uses: actions/checkout@v6

      - name: Install sccache (if missing)
        # If MinIO is unreachable, fall back to compiling without cache.
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
            sudo mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
            sudo chmod +x /usr/local/bin/sccache
          fi
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Disable sccache for coverage instrumentation
        # sccache serves cached, uninstrumented object code, which suppresses
        # llvm-cov region/line measurement. Run the coverage build uncached.
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Coverage policy gate
        # `make larql-models-coverage-summary` runs `cargo llvm-cov`
        # with the floor check AND calls `scripts/check_coverage_policy.py`,
        # so any regression on the per-file debt baselines or the total
        # floor fails CI here.
        run: make larql-models-coverage-summary

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
