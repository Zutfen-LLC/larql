# larql-compute Linux CI
#
# Validates the CPU baseline on the Linux self-hosted runner. After the
# Metal extraction (ADR-019), this workflow is CPU-only; the macOS
# Metal workflow is paused until that runner surface is needed again.

name: larql-compute

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-compute/**'
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-compute.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-compute/**'
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-compute.yml'
  workflow_dispatch: {}

jobs:
  test:
    name: test · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    env:
      # `nproc`-based thread-pool sizing (OpenBLAS's own pthread pool)
      # can oversubscribe if the container's visible CPU count doesn't
      # match its actual cgroup quota, which has been a contributor to
      # SIGILL/SIGSEGV crashes mid-test-run on this runner fleet. Capping
      # it is cheap insurance regardless of which host a job lands on.
      OPENBLAS_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Pin a safe OpenBLAS kernel on AVX2-less hosts
        # This self-hosted runner fleet is heterogeneous — some hosts
        # lack AVX2 (confirmed by the scalar-fallback fix in
        # `crates/larql-vindex/src/index/storage/gate_store.rs`, added
        # after hitting the same crash class there), and on those hosts
        # system OpenBLAS's own runtime dispatch ("DYNAMIC_ARCH") has
        # been observed landing on an AVX2-assuming kernel anyway,
        # causing SIGILL/SIGSEGV mid-test-run. Only override the kernel
        # choice when *this* host actually lacks AVX2 — a blanket
        # `OPENBLAS_CORETYPE=NEHALEM` regressed a previously-passing run
        # on a different (AVX2-capable) host in this fleet, so don't
        # reintroduce that as an unconditional env var.
        run: |
          if ! grep -qw avx2 /proc/cpuinfo; then
            echo "host lacks AVX2 — pinning OPENBLAS_CORETYPE=NEHALEM"
            echo "OPENBLAS_CORETYPE=NEHALEM" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compute-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-compute-

      - name: Format check
        run: cargo fmt -p larql-compute -- --check

      - name: Check default features
        run: cargo check -p larql-compute --all-targets

      - name: Check all features
        run: cargo check -p larql-compute --all-targets --all-features

      - name: Clippy default features
        # `--no-deps` so warnings in sibling crates' in-flight work do
        # not promote to errors here; matches the local `make
        # larql-compute-lint` target.
        run: cargo clippy -p larql-compute --all-targets --no-deps -- -D warnings

      - name: Clippy all features
        run: cargo clippy -p larql-compute --all-targets --no-deps --all-features -- -D warnings

      - name: Unit tests
        run: cargo test -p larql-compute --lib

      - name: Backend contract tests
        run: cargo test -p larql-compute --test test_backend_matmul_quant

  coverage:
    name: coverage · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    container:
      image: rust:1-bookworm

    env:
      # See the `test` job above for why this is capped.
      OPENBLAS_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Pin a safe OpenBLAS kernel on AVX2-less hosts
        # See the `test` job above for the full rationale.
        run: |
          if ! grep -qw avx2 /proc/cpuinfo; then
            echo "host lacks AVX2 — pinning OPENBLAS_CORETYPE=NEHALEM"
            echo "OPENBLAS_CORETYPE=NEHALEM" >> "$GITHUB_ENV"
          fi

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage policy gate
        # `make larql-compute-coverage-summary` runs `cargo llvm-cov`
        # with `--fail-under-lines` AND invokes
        # `scripts/check_coverage_policy.py`, so any regression on
        # per-file floors or the total floor fails CI here.
        run: make larql-compute-coverage-summary
