# larql-compute Linux CI
#
# Validates the CPU baseline on the Linux self-hosted runner. After the
# Metal extraction (ADR-019), this workflow is CPU-only; the macOS
# Metal workflow is paused until that runner surface is needed again.

name: larql-compute

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: ghcr.io/zutfen-llc/larql-ci-rust:latest
      volumes:
        - larql-cargo-registry:/usr/local/cargo/registry

    steps:
      - uses: actions/checkout@v6

      - name: Verify sccache + MinIO connectivity
        # sccache is pre-baked in the CI image. Just verify MinIO is reachable.
        # If unreachable, disable sccache so the build still completes.
        run: |
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Format check
        run: cargo fmt -p larql-compute -- --check

      - name: Check default features
        run: cargo check -p larql-compute --all-targets

      - name: Check all features
        run: cargo check -p larql-compute --all-targets --all-features

      - name: Clippy default features
        # `--no-deps` so warnings in sibling crates' in-flight work do
        # not promote to errors here; matches the local `make
        # larql-compute-lint` target.
        run: cargo clippy -p larql-compute --all-targets --no-deps -- -D warnings

      - name: Clippy all features
        run: cargo clippy -p larql-compute --all-targets --no-deps --all-features -- -D warnings

      - name: Unit tests
        run: cargo test -p larql-compute --lib

      - name: Backend contract tests
        run: cargo test -p larql-compute --test test_backend_matmul_quant

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true
  coverage:
    name: coverage · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    container:
      image: ghcr.io/zutfen-llc/larql-ci-rust:latest
      volumes:
        - larql-cargo-registry:/usr/local/cargo/registry

    steps:
      - uses: actions/checkout@v6

      - name: Verify sccache + MinIO connectivity
        # sccache is pre-baked in the CI image. Just verify MinIO is reachable.
        # If unreachable, disable sccache so the build still completes.
        run: |
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Disable sccache for coverage instrumentation
        # sccache serves cached, uninstrumented object code, which suppresses
        # llvm-cov region/line measurement. Run the coverage build uncached.
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Coverage policy gate
        # `make larql-compute-coverage-summary` runs `cargo llvm-cov`
        # with `--fail-under-lines` AND invokes
        # `scripts/check_coverage_policy.py`, so any regression on
        # per-file floors or the total floor fails CI here.
        run: make larql-compute-coverage-summary
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true
