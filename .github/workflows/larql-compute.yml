# larql-compute Linux CI
#
# Validates the CPU baseline on the Linux self-hosted runner. After the
# Metal extraction (ADR-019), this workflow is CPU-only; the macOS
# Metal workflow is paused until that runner surface is needed again.

name: larql-compute

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-compute/**'
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-compute.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-compute/**'
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-compute.yml'
  workflow_dispatch: {}

jobs:
  test:
    name: test · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    env:
      # This self-hosted runner's CPU does not expose AVX2 (confirmed by
      # the scalar-fallback fix in
      # `larql-vindex/src/index/storage/gate_store.rs`, which had to work
      # around the same class of crash locally). System OpenBLAS
      # (installed below) picks a SIMD kernel at runtime via its own
      # CPU-model dispatch table ("DYNAMIC_ARCH"), and on this host it was
      # landing on a kernel that assumes AVX2 anyway — hence the
      # SIGILL/SIGSEGV crashes mid-test-run. Pinning a pre-AVX coretype
      # (Nehalem: SSE4.2 baseline, ~2008+) forces OpenBLAS onto a kernel
      # this CPU can actually execute, at the cost of some BLAS
      # throughput. Don't "upgrade" this to Haswell/Sandybridge etc.
      # without confirming the runner actually has AVX2 — that's what
      # caused this in the first place.
      OPENBLAS_CORETYPE: NEHALEM
      # Likewise, `nproc`-based thread-pool sizing (OpenBLAS's own pthread
      # pool) can oversubscribe if the container's visible CPU count
      # doesn't match its actual cgroup quota — capping this removes a
      # second source of the same class of crash.
      OPENBLAS_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compute-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-compute-

      - name: Format check
        run: cargo fmt -p larql-compute -- --check

      - name: Check default features
        run: cargo check -p larql-compute --all-targets

      - name: Check all features
        run: cargo check -p larql-compute --all-targets --all-features

      - name: Clippy default features
        # `--no-deps` so warnings in sibling crates' in-flight work do
        # not promote to errors here; matches the local `make
        # larql-compute-lint` target.
        run: cargo clippy -p larql-compute --all-targets --no-deps -- -D warnings

      - name: Clippy all features
        run: cargo clippy -p larql-compute --all-targets --no-deps --all-features -- -D warnings

      - name: Unit tests
        run: cargo test -p larql-compute --lib

      - name: Backend contract tests
        run: cargo test -p larql-compute --test test_backend_matmul_quant

  coverage:
    name: coverage · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    container:
      image: rust:1-bookworm

    env:
      # See the `test` job above for why these are pinned — same runner,
      # same system OpenBLAS, same crash class (this job is the one that
      # actually hit the SIGILL).
      OPENBLAS_CORETYPE: NEHALEM
      OPENBLAS_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage policy gate
        # `make larql-compute-coverage-summary` runs `cargo llvm-cov`
        # with `--fail-under-lines` AND invokes
        # `scripts/check_coverage_policy.py`, so any regression on
        # per-file floors or the total floor fails CI here.
        run: make larql-compute-coverage-summary
