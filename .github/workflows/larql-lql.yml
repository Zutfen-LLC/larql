# larql-lql Linux CI
#
# LQL parser, executor, and REPL. The crate is model/architecture
# agnostic — parser tests are pure, executor integration tests use
# `mockito` to fake the Remote backend, and the metal feature is opt-in
# (default = []). Same surface runs on the Linux self-hosted runner.

name: larql-lql

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-lql/**'
      - 'crates/larql-core/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-inference/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-lql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-lql/**'
      - 'crates/larql-core/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-inference/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-lql.yml'
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install sccache
        # Debian bookworm sccache pkg (0.4.0-pre6) lacks S3 backend — use official binary.
        # If MinIO is unreachable, fall back to compiling without cache.
        run: |
          curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Format check
        run: cargo fmt -p larql-lql -- --check

      - name: Check all targets
        run: cargo check -p larql-lql --all-targets

      - name: Clippy
        # `--no-deps` keeps lints scoped to larql-lql itself; otherwise
        # pre-existing clippy debt in `larql-inference` (a transitive
        # dep) would surface here.
        run: cargo clippy -p larql-lql --all-targets --no-deps -- -D warnings

      - name: Tests
        run: cargo test -p larql-lql

      - name: Benchmark compile/tests
        run: cargo test -p larql-lql --benches

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true
  coverage:
    name: coverage - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install sccache
        # Debian bookworm sccache pkg (0.4.0-pre6) lacks S3 backend — use official binary.
        # If MinIO is unreachable, fall back to compiling without cache.
        run: |
          curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Disable sccache for coverage instrumentation
        # sccache serves cached, uninstrumented object code, which suppresses
        # llvm-cov region/line measurement. Run the coverage build uncached.
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Coverage summary
        run: cargo llvm-cov --package larql-lql --summary-only
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true
