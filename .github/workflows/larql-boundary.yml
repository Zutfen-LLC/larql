# larql-boundary Linux CI
#
# Runs fmt + check + clippy + tests + bench test-mode on the Linux self-hosted
# runner. No model weights or MLX required — the crate is pure Rust.
# Containerized (rust:1-bookworm) for a hermetic cc/linker/libssl toolchain.

name: larql-boundary

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    container:
      image: ghcr.io/zutfen-llc/larql-ci-rust:latest
      volumes:
        - larql-cargo-registry:/usr/local/cargo/registry

    steps:
      - uses: actions/checkout@v6

      - name: Verify sccache + MinIO connectivity
        # sccache is pre-baked in the CI image. Just verify MinIO is reachable.
        # If unreachable, disable sccache so the build still completes.
        run: |
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt -p larql-boundary -- --check

      - name: Check (all targets)
        run: cargo check -p larql-boundary --all-targets

      - name: Clippy (warnings as errors)
        run: cargo clippy -p larql-boundary --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test -p larql-boundary

      - name: Test benchmarks (compile + smoke)
        run: cargo test -p larql-boundary --benches

      - name: Run examples
        run: |
          cargo run -p larql-boundary --example encode_decode
          cargo run -p larql-boundary --example gate_decision

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true

  # No coverage job: this crate's coverage was `cargo llvm-cov --summary-only`
  # with no `--fail-under` threshold and no policy file — an uncached
  # instrumented build that asserted nothing.
