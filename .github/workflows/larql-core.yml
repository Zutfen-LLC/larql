# larql-core Linux CI
#
# Runs fmt + feature matrix + clippy + tests + examples + bench test-mode on
# the Linux self-hosted runner. The crate is model-architecture agnostic and
# these checks require no model weights or platform-specific backends.

name: larql-core

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-core.yml'
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25

    steps:
      - name: Reclaim root-owned workspace paths for host checkout
        run: chmod -R a+rwX . || true
      - uses: actions/checkout@v6

      - name: Install sccache (if missing)
        # If MinIO is unreachable, fall back to compiling without cache.
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
            mkdir -p "$HOME/.local/bin"
            mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache "$HOME/.local/bin/sccache"
            chmod +x "$HOME/.local/bin/sccache"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt -p larql-core -- --check

      - name: Check default features
        run: cargo check -p larql-core --all-targets

      - name: Check no default features
        run: cargo check -p larql-core --no-default-features --all-targets

      - name: Check msgpack-only feature
        run: cargo check -p larql-core --no-default-features --features msgpack --all-targets

      - name: Clippy default features
        run: cargo clippy -p larql-core --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test -p larql-core

      - name: Feature matrix tests
        run: |
          cargo test -p larql-core --no-default-features
          cargo test -p larql-core --no-default-features --features msgpack

      - name: Test benchmarks
        run: cargo test -p larql-core --benches

      - name: Run examples
        run: |
          cargo run -p larql-core --example edge_demo
          cargo run -p larql-core --example graph_demo
          cargo run -p larql-core --example algorithm_demo
          cargo run -p larql-core --example filter_demo
          cargo run -p larql-core --example serialization_demo

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  coverage:
    name: coverage · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25

    steps:
      - name: Reclaim root-owned workspace paths for host checkout
        run: chmod -R a+rwX . || true
      - uses: actions/checkout@v6

      - name: Install sccache (if missing)
        # If MinIO is unreachable, fall back to compiling without cache.
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
            mkdir -p "$HOME/.local/bin"
            mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache "$HOME/.local/bin/sccache"
            chmod +x "$HOME/.local/bin/sccache"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        # cargo install puts the binary in ~/.cargo/bin (no sudo); the
        # taiki-e/install-action tries /usr/local/bin via sudo, which the
        # bare host runner rejects (password required).
        run: cargo install cargo-llvm-cov --locked --quiet

      - name: Disable sccache for coverage instrumentation
        # sccache serves cached, uninstrumented object code, which suppresses
        # llvm-cov region/line measurement. Run the coverage build uncached.
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Coverage summary
        run: cargo llvm-cov --package larql-core --summary-only

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
