# larql-core Linux CI
#
# Runs fmt + feature matrix + clippy + tests + examples + bench test-mode on
# the Linux self-hosted runner. The crate is model-architecture agnostic and
# these checks require no model weights or platform-specific backends.
# Containerized (rust:1-bookworm) for a hermetic cc/linker toolchain.

name: larql-core

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-core.yml'
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    container:
      image: ghcr.io/zutfen-llc/larql-ci-rust:latest
      volumes:
        - larql-cargo-registry:/usr/local/cargo/registry

    steps:
      - uses: actions/checkout@v6

      - name: Verify sccache + MinIO connectivity
        # sccache is pre-baked in the CI image. Just verify MinIO is reachable.
        # If unreachable, disable sccache so the build still completes.
        run: |
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt -p larql-core -- --check

      - name: Check default features
        run: cargo check -p larql-core --all-targets

      - name: Check no default features
        run: cargo check -p larql-core --no-default-features --all-targets

      - name: Check msgpack-only feature
        run: cargo check -p larql-core --no-default-features --features msgpack --all-targets

      - name: Clippy default features
        run: cargo clippy -p larql-core --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test -p larql-core

      - name: Feature matrix tests
        run: |
          cargo test -p larql-core --no-default-features
          cargo test -p larql-core --no-default-features --features msgpack

      - name: Test benchmarks
        run: cargo test -p larql-core --benches

      - name: Run examples
        run: |
          cargo run -p larql-core --example edge_demo
          cargo run -p larql-core --example graph_demo
          cargo run -p larql-core --example algorithm_demo
          cargo run -p larql-core --example filter_demo
          cargo run -p larql-core --example serialization_demo

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true

  # No coverage job: this crate's coverage was `cargo llvm-cov --summary-only`
  # with no `--fail-under` threshold and no policy file — an uncached
  # instrumented build that asserted nothing. The five crate workflows that
  # DO gate coverage (models, compute, vindex, server, kv) keep theirs.
