# larql-compute-cuda CI (CPU-only compile check).
#
# CUDA GPU backend for larql-compute.  This workflow is CPU-only:
# `larql-compute-cuda` links via cudarc's `fallback-dynamic-loading`,
# so it compiles on a host with no CUDA driver/runtime installed (see
# `crates/larql-compute-cuda/Cargo.toml`).  The goal is to catch compile
# regressions -- cudarc version bumps, or unsafe `launch_builder` arg-order
# drift (silent UB at runtime, e.g. `runtime.rs` kv_append launch) -- in CI
# instead of only on a developer machine with a GPU.
#
# No GPU is required, and no runtime tests are executed.

name: larql-compute-cuda

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  check:
    name: check · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: ghcr.io/zutfen-llc/larql-ci-rust:latest
      volumes:
        - larql-cargo-registry:/usr/local/cargo/registry

    steps:
      - uses: actions/checkout@v6

      - name: Verify sccache + MinIO connectivity
        # sccache is pre-baked in the CI image. Just verify MinIO is reachable.
        # If unreachable, disable sccache so the build still completes.
        run: |
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        # `larql-compute` and `larql-inference` link BLAS on Linux via
        # `openblas-src` (system feature); cudarc itself needs no system
        # libs thanks to `fallback-dynamic-loading`.
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Format check
        run: cargo fmt -p larql-compute-cuda -- --check

      - name: Check (all targets)
        # Compile-only; no GPU needed. `fallback-dynamic-loading` means
        # cudarc resolves the driver at runtime via dlopen, never at link
        # time, so this stays green on the self-hosted Linux x64 runner.
        run: cargo check -p larql-compute-cuda --all-targets

      - name: Clippy (no-deps)
        # `--no-deps` so warnings in sibling crates in-flight work do
        # not promote to errors here; matches the local `make` lint
        # targets and the other compute CI workflows.
        run: cargo clippy -p larql-compute-cuda --all-targets --no-deps -- -D warnings

      - name: Check larql-inference --features cuda
        # Ensures the cuda activation path through the inference facade
        # (optional dep + `larql-vindex/cuda`) still compiles end-to-end.
        run: cargo check -p larql-inference --features cuda

      - name: Check larql-inference --features gpu-all
        # `gpu-all` = metal + cuda + vulkan.  On Linux the metal crate
        # compiles to an empty lib (its source is `#[cfg(target_os =
        # "macos")]`-gated), so this exercises the cuda + vulkan
        # activation together without requiring any GPU.
        run: cargo check -p larql-inference --features gpu-all
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true
