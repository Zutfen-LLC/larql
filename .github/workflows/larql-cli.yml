# larql-cli Linux CI
#
# Top-level `larql` binary. Default features enable Metal on every
# member crate, which only resolves on macOS. Linux runs use
# `--no-default-features` so the CPU-only surface is exercised while
# macOS runner coverage is paused.
#
# `convert_moe_to_per_layer` example currently doesn't build against
# the post-refactor `larql-inference` API; CI checks bins + tests
# instead of `--all-targets` until that example is repaired.

name: larql-cli

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-cli/**'
      - 'crates/larql-lql/**'
      - 'crates/larql-kv/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-inference/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-cli/**'
      - 'crates/larql-lql/**'
      - 'crates/larql-kv/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-inference/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-cli.yml'
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install sccache
        # Debian bookworm sccache pkg (0.4.0-pre6) lacks S3 backend — use official binary.
        # If MinIO is unreachable, fall back to compiling without cache.
        run: |
          curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Format check
        run: cargo fmt -p larql-cli -- --check

      - name: Check (CPU only)
        run: cargo check -p larql-cli --bins --tests --no-default-features

      # Clippy is intentionally skipped: as of 2026-05-10 `larql-cli`
      # carries ~82 pre-existing errors under default features and ~112
      # under `--no-default-features` (mostly `large_enum_variant` and
      # `dead_code` on metal-only paths). Re-enable once that backlog
      # is cleared; the other crates' workflows already enforce
      # `clippy -- -D warnings`.

      - name: Tests (CPU only)
        run: cargo test -p larql-cli --no-default-features

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX .git target .github coverage || true
  coverage:
    name: coverage - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install sccache
        # Debian bookworm sccache pkg (0.4.0-pre6) lacks S3 backend — use official binary.
        # If MinIO is unreachable, fall back to compiling without cache.
        run: |
          curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Disable sccache for coverage instrumentation
        # sccache serves cached, uninstrumented object code, which suppresses
        # llvm-cov region/line measurement. Run the coverage build uncached.
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Coverage summary
        run: cargo llvm-cov --package larql-cli --no-default-features --summary-only
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX .git target .github coverage || true
