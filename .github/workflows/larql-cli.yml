# larql-cli Linux CI
#
# Top-level `larql` binary. Default features enable Metal on every
# member crate, which only resolves on macOS. Linux runs use
# `--no-default-features` so the CPU-only surface is exercised while
# macOS runner coverage is paused.
#
# `convert_moe_to_per_layer` example currently doesn't build against
# the post-refactor `larql-inference` API; CI checks bins + tests
# instead of `--all-targets` until that example is repaired.

name: larql-cli

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-cli/**'
      - 'crates/larql-lql/**'
      - 'crates/larql-kv/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-inference/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-cli/**'
      - 'crates/larql-lql/**'
      - 'crates/larql-kv/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-inference/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-cli.yml'
  workflow_dispatch: {}

jobs:
  test:
    name: test - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cli-

      - name: Format check
        run: cargo fmt -p larql-cli -- --check

      - name: Check (CPU only)
        run: cargo check -p larql-cli --bins --tests --no-default-features

      # Clippy is intentionally skipped: as of 2026-05-10 `larql-cli`
      # carries ~82 pre-existing errors under default features and ~112
      # under `--no-default-features` (mostly `large_enum_variant` and
      # `dead_code` on metal-only paths). Re-enable once that backlog
      # is cleared; the other crates' workflows already enforce
      # `clippy -- -D warnings`.

      - name: Tests (CPU only)
        run: cargo test -p larql-cli --no-default-features

      - name: Reclaim root-owned target/ for the host
        # This job runs in a `rust:1-bookworm` container, so everything
        # under target/ is owned by root. Non-containerized jobs sharing
        # this workspace (larql-models et al.) then fail at checkout's
        # `git clean` with "Permission denied" — before any build runs.
        # Make the tree world-writable so the host can remove it.
        # `if: always()` covers the failed-job path too (cancellations
        # skip it, but those are rare here).
        if: always()
        run: chmod -R a+rwX target || true

  coverage:
    name: coverage - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --package larql-cli --no-default-features --summary-only

      - name: Reclaim root-owned target/ for the host
        # See the same-named step in the `test` job above: this container
        # writes target/llvm-cov-target/ as root, which the host cannot
        # git-clean at the next checkout. Make it world-writable.
        # `if: always()` so a failed coverage run still reclaims the tree.
        if: always()
        run: chmod -R a+rwX target || true
