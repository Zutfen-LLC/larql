# larql-vindex Linux CI
#
# The crate checks here are model/model-architecture agnostic: no HuggingFace
# downloads, no real model weights, and no platform-specific GPU backends.
# Tests and examples use synthetic fixtures or compile-only checks so the same
# surface runs on the Linux self-hosted runner.

name: larql-vindex

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-vindex/**'
      - 'crates/larql-lql/src/executor/lifecycle/compile/into_vindex.rs'
      - 'crates/larql-compute/src/cpu/ops/q4k_q8k_dot.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-vindex.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-vindex/**'
      - 'crates/larql-lql/src/executor/lifecycle/compile/into_vindex.rs'
      - 'crates/larql-compute/src/cpu/ops/q4k_q8k_dot.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-vindex.yml'
  workflow_dispatch: {}

env:
  LARQL_VINDEX_COVERAGE_MIN: 71

jobs:
  test:
    name: test - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vindex-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vindex-

      - name: Format check
        run: cargo fmt -p larql-vindex -- --check

      - name: Check all targets
        run: cargo check -p larql-vindex --all-targets

      - name: Check examples
        run: cargo check -p larql-vindex --examples

      - name: Clippy
        run: cargo clippy -p larql-vindex --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p larql-vindex

      - name: Benchmark compile/tests
        run: cargo test -p larql-vindex --benches

      - name: Reclaim root-owned target/ for the host
        # This job runs in a `rust:1-bookworm` container, so target/ is
        # owned by root. Non-containerized jobs sharing this workspace
        # (larql-models et al.) then fail at checkout's `git clean` with
        # "Permission denied" — before any build runs. Make the tree
        # world-writable so the host can remove it. `if: always()` covers
        # the failed-job path too (cancellations skip it, but those are
        # rare here).
        if: always()
        run: chmod -R a+rwX target || true

  coverage:
    name: coverage - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --package larql-vindex --summary-only --fail-under-lines "$LARQL_VINDEX_COVERAGE_MIN"

      - name: Coverage policy
        run: |
          mkdir -p coverage/larql-vindex
          cargo llvm-cov report --package larql-vindex --json --summary-only --output-path coverage/larql-vindex/summary.json
          python3 scripts/check_coverage_policy.py coverage/larql-vindex/summary.json crates/larql-vindex/coverage-policy.json

      - name: Reclaim root-owned target/ for the host
        # See the same-named step in the `test` job above: this container
        # writes target/llvm-cov-target/ as root, which the host cannot
        # git-clean at the next checkout. Make it world-writable.
        # `if: always()` so a failed coverage run still reclaims the tree.
        if: always()
        run: chmod -R a+rwX target || true
