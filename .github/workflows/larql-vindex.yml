# larql-vindex Linux CI
#
# The crate checks here are model/model-architecture agnostic: no HuggingFace
# downloads, no real model weights, and no platform-specific GPU backends.
# Tests and examples use synthetic fixtures or compile-only checks so the same
# surface runs on the Linux self-hosted runner.

name: larql-vindex

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-vindex/**'
      - 'crates/larql-lql/src/executor/lifecycle/compile/into_vindex.rs'
      - 'crates/larql-compute/src/cpu/ops/q4k_q8k_dot.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-vindex.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-vindex/**'
      - 'crates/larql-lql/src/executor/lifecycle/compile/into_vindex.rs'
      - 'crates/larql-compute/src/cpu/ops/q4k_q8k_dot.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-vindex.yml'
  workflow_dispatch: {}

env:
  LARQL_VINDEX_COVERAGE_MIN: 71
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://10.0.0.33:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: ghcr.io/zutfen-llc/larql-ci-rust:latest
      volumes:
        - larql-cargo-registry:/usr/local/cargo/registry

    steps:
      - uses: actions/checkout@v6

      - name: Verify sccache + MinIO connectivity
        # sccache is pre-baked in the CI image. Just verify MinIO is reachable.
        # If unreachable, disable sccache so the build still completes.
        run: |
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Format check
        run: cargo fmt -p larql-vindex -- --check

      - name: Check all targets
        run: cargo check -p larql-vindex --all-targets

      - name: Check examples
        run: cargo check -p larql-vindex --examples

      - name: Clippy
        run: cargo clippy -p larql-vindex --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p larql-vindex

      - name: Benchmark compile/tests
        run: cargo test -p larql-vindex --benches

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true
  coverage:
    name: coverage - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: ghcr.io/zutfen-llc/larql-ci-rust:latest
      volumes:
        - larql-cargo-registry:/usr/local/cargo/registry

    steps:
      - uses: actions/checkout@v6

      - name: Verify sccache + MinIO connectivity
        # sccache is pre-baked in the CI image. Just verify MinIO is reachable.
        # If unreachable, disable sccache so the build still completes.
        run: |
          if ! curl -sf --connect-timeout 3 "$SCCACHE_ENDPOINT/minio/health/live" >/dev/null 2>&1; then
            echo "::warning::MinIO cache unreachable — compiling without sccache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Disable sccache for coverage instrumentation
        # sccache serves cached, uninstrumented object code, which suppresses
        # llvm-cov region/line measurement. Run the coverage build uncached.
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Coverage summary
        run: cargo llvm-cov --package larql-vindex --summary-only --fail-under-lines "$LARQL_VINDEX_COVERAGE_MIN"

      - name: Coverage policy
        run: |
          mkdir -p coverage/larql-vindex
          cargo llvm-cov report --package larql-vindex --json --summary-only --output-path coverage/larql-vindex/summary.json
          python3 scripts/check_coverage_policy.py coverage/larql-vindex/summary.json crates/larql-vindex/coverage-policy.json
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX . || true
