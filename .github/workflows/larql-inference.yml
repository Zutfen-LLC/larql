# larql-inference Linux CI
#
# Transformer inference engine — forward pass, attention, FFN, layer
# norm. Tests that need real model weights are gated `#[ignore]`
# (test_arch_golden, test_logits_goldens, test_gemma3_smoke,
# test_generate_q4k_cpu, test_layer_graph_integration); CI runs the
# default test set only. Several diagnostic examples
# (cpu_gpu_diag, debug_generate, debug_gpu_step, debug_layers,
# decode_vs_prefill, residual_diff, stage_bisect) currently lag the
# refactored `larql-compute` decode API and are excluded from the
# `cargo check` surface — repair them and add `--examples` here.

name: larql-inference

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-inference/**'
      - 'crates/larql-compute/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-router-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-inference.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-inference/**'
      - 'crates/larql-compute/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-models/**'
      - 'crates/larql-router-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-inference.yml'
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://100.109.47.61:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G
  SCCACHE_REGION: us-east-1

jobs:
  test:
    name: test - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install sccache
        # Debian bookworm sccache pkg (0.4.0-pre6) lacks S3 backend — use official binary
        run: |
          curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Format check
        run: cargo fmt -p larql-inference -- --check

      - name: Check lib + tests + benches
        run: cargo check -p larql-inference --lib --tests --benches

      - name: Clippy
        run: cargo clippy -p larql-inference --lib --tests --benches --no-deps -- -D warnings

      # `cargo test` runs lib tests + integration tests; #[ignore]
      # markers on weight-dependent goldens keep them out of the
      # default set. Bench targets compile-check via `--benches` above.
      - name: Tests
        run: cargo test -p larql-inference

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX .git target || true
  coverage:
    name: coverage - self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install sccache
        # Debian bookworm sccache pkg (0.4.0-pre6) lacks S3 backend — use official binary
        run: |
          curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --package larql-inference --summary-only
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX .git target || true
