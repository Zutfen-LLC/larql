# larql-compute-vulkan CI (CPU-only compile check).
#
# Vulkan GPU backend for larql-compute.  This workflow is CPU-only:
# `larql-compute-vulkan` has no external (non-Rust) dependencies, so it
# compiles cleanly on the self-hosted Linux x64 runner.  The goal is to catch
# compile regressions -- API drift, trait-impl mismatches -- in CI instead
# of only on a developer machine with a GPU.
#
# No GPU is required, and no runtime tests are executed.
#
# DORMANT: `larql-compute-vulkan` is currently a scaffold that delegates to
# CPU reference implementations (`supports_*` all return false). To avoid
# spending self-hosted runner time verifying a stub against upstream trait
# changes, this workflow is gated to manual dispatch only. When real Vulkan
# kernel work begins, restore push/pull_request triggers with the original
# path set (larql-compute/models/vindex/inference + Cargo files).

name: larql-compute-vulkan

on:
  workflow_dispatch: {}

jobs:
  check:
    name: check · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        # `larql-compute` and `larql-inference` link BLAS on Linux via
        # `openblas-src` (system feature); the vulkan crate itself has
        # no external system dependency.
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-cargo-compute-vulkan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            Linux-cargo-compute-vulkan-

      - name: Format check
        run: cargo fmt -p larql-compute-vulkan -- --check

      - name: Check (all targets)
        run: cargo check -p larql-compute-vulkan --all-targets

      - name: Clippy (no-deps)
        # `--no-deps` so warnings in sibling crates in-flight work do
        # not promote to errors here; matches the local `make` lint
        # targets and the other compute CI workflows.
        run: cargo clippy -p larql-compute-vulkan --all-targets --no-deps -- -D warnings

      - name: Check larql-inference --features vulkan
        # Ensures the vulkan activation path through the inference
        # facade (optional dep + `larql-vindex/vulkan`) still compiles
        # end-to-end.
        run: cargo check -p larql-inference --features vulkan

      - name: Reclaim root-owned target/ for the host
        # This job runs in a `rust:1-bookworm` container, so target/ is
        # owned by root. Non-containerized jobs sharing this workspace
        # (larql-models et al.) then fail at checkout's `git clean` with
        # "Permission denied" — before any build runs. Make the tree
        # world-writable so the host can remove it. `if: always()` covers
        # the failed-job path too (cancellations skip it, but those are
        # rare here).
        if: always()
        run: chmod -R a+rwX target || true
