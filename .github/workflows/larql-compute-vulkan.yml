# larql-compute-vulkan CI (CPU-only compile check).
#
# Vulkan GPU backend for larql-compute.  This workflow is CPU-only:
# `larql-compute-vulkan` has no external (non-Rust) dependencies, so it
# compiles cleanly on the self-hosted Linux x64 runner.  The goal is to catch
# compile regressions -- API drift, trait-impl mismatches -- in CI instead
# of only on a developer machine with a GPU.
#
# No GPU is required, and no runtime tests are executed.

name: larql-compute-vulkan

on:
  push:
    branches: [main]
    paths:
      - crates/larql-compute-vulkan/**
      - crates/larql-compute/**
      - crates/larql-models/**
      - crates/larql-vindex/**
      - crates/larql-inference/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/larql-compute-vulkan.yml
  pull_request:
    branches: [main]
    paths:
      - crates/larql-compute-vulkan/**
      - crates/larql-compute/**
      - crates/larql-models/**
      - crates/larql-vindex/**
      - crates/larql-inference/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/larql-compute-vulkan.yml
  workflow_dispatch: {}

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://100.109.47.61:9000
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: QurhTA4fSewUayZI7z5ovNmO
  SCCACHE_CACHE_SIZE: 20G

jobs:
  check:
    name: check · self-hosted-linux-x64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v6

      - name: Install sccache
        # Debian bookworm sccache pkg (0.4.0-pre6) lacks S3 backend — use official binary
        run: |
          curl -sL https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          mv /tmp/sccache-v0.16.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS
        # `larql-compute` and `larql-inference` link BLAS on Linux via
        # `openblas-src` (system feature); the vulkan crate itself has
        # no external system dependency.
        run: |
          apt-get update
          apt-get install -y libopenblas-dev pkg-config cmake g++ protobuf-compiler libssl-dev

      - name: Format check
        run: cargo fmt -p larql-compute-vulkan -- --check

      - name: Check (all targets)
        run: cargo check -p larql-compute-vulkan --all-targets

      - name: Clippy (no-deps)
        # `--no-deps` so warnings in sibling crates in-flight work do
        # not promote to errors here; matches the local `make` lint
        # targets and the other compute CI workflows.
        run: cargo clippy -p larql-compute-vulkan --all-targets --no-deps -- -D warnings

      - name: Check larql-inference --features vulkan
        # Ensures the vulkan activation path through the inference
        # facade (optional dep + `larql-vindex/vulkan`) still compiles
        # end-to-end.
        run: cargo check -p larql-inference --features vulkan
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Reclaim root-owned Git workspace paths for host checkout
        if: always()
        run: chmod -R a+rwX .git target || true
